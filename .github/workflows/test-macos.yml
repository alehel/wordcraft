name: Test macOS build (fork only)

# Fork-only: builds the ad-hoc signed (not notarized) macOS Apple-silicon DMG + CLI zip of a test
# integration branch with packaging/macos/package.sh, as the release workflow's macOS job does,
# without signing secrets, the release environment or a draft release. Not meant for upstream.
on:
  push:
    branches: ['test/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS aarch64
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-macos-aarch64
      - name: Build and package (ad-hoc signed)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordcraft-macos-aarch64
          path: dist/release/*
          if-no-files-found: error
